<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Form Dalam Table</title>
  </head>
  <body>
    <h1>Contoh Elemen Elemen Form pada HTML</h1>

    <form>
      <table cellpadding="7" cellspacing="0">
        <tr>
          <td align="right"><label for="nama">Nama: </label></td>
          <td>
            <input
              type="text"
              name="nama"
              id="nama"
              placeholder="Masukkan nama"
            />
          </td>
        </tr>

        <tr>
          <td align="right"><label for="password">Password: </label></td>
          <td>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Masukkan password"
            />
          </td>
        </tr>

        <tr>
          <td align="right"><label for="email">Email: </label></td>
          <td>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Masukkan email"
            />
          </td>
        </tr>

        <tr>
          <td align="right"><label for="umur">Umur: </label></td>
          <td>
            <input
              type="number"
              name="umur"
              id="umur"
              min="0"
              max="100"
              placeholder="0"
            />
          </td>
        </tr>

        <tr>
          <td align="right"><label for="tanggal">Tanggal: </label></td>
          <td><input type="date" name="tanggal" id="tanggal" /></td>
        </tr>

        <tr>
          <td align="right"><label for="warna">Warna:</label></td>
          <td><input type="color" name="color" id="warna" /></td>
        </tr>

        <tr>
          <td>
            <button type="submit">Submit</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
