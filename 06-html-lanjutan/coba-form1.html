<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Elemen Form</title>
  </head>
  <body>
    <h1>Contoh Elemen Elemen Form pada HTML</h1>

    <form>
      <label for="nama"
        >Nama:
        <input type="text" name="nama" id="nama" placeholder="Masukkan nama" />
      </label>

      <br />

      <label for="password"
        >Password:
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Masukkan password"
        />
      </label>

      <br />

      <label for="email"
        >Email:
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Masukkan email"
        />
      </label>

      <br />

      <label for="umur"
        >Umur:
        <input
          type="number"
          name="umur"
          id="umur"
          min="0"
          max="100"
          placeholder="0"
          step="5"
        />
      </label>

      <br />

      <label for="tanggal"
        >Tanggal:
        <input type="date" name="tanggal" id="tanggal" />
      </label>

      <br />

      <label for="warna"
        >Warna:
        <input type="color" name="color" id="warna" />
      </label>

      <br />
      <br />

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
