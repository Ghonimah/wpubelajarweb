<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Text - Text Overflow & Shadow</title>
    <style>
      h1 {
        text-transform: capitalize;
        font-size: 100px;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        text-shadow: 5px 10px 5px lightblue;
      }

      p {
        font-size: 26px;
        white-space: nowrap;
        width: 300px;
        background-color: aqua;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <h1>Hello, CSS!</h1>
    <p>
      Lorem, ipsum dolor sit amet consectetur adipisicing elit. Asperiores
      distinctio voluptates ex omnis dolorem animi est aperiam, similique
      suscipit ab quisquam ratione adipisci impedit veniam molestias eum,
      eveniet quos molestiae?
    </p>
  </body>
</html>
