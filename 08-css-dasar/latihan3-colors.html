<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sparks by Coldplay - Colored</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: #b65607;
        font-size: 30px;
        text-align: center;
        word-spacing: 20px;
        letter-spacing: 5px;
        background-color: #121212;
      }

      h1 {
        font-size: 48px;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: #b65607;
        text-shadow: 5px 5px #592901;
      }

      .lyrics {
        font-size: 24px;
        line-height: 2.2;
        word-spacing: 5px;
        color: azure;
      }

      span {
        color: #b62407;
        text-decoration: line-through;
      }

      .credit {
        font-size: 16px;
        color: rgb(166, 166, 166);
        letter-spacing: 2px;
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <h1>I Saw Sparks</h1>

    <p class="lyrics">
      "My heart is yours. <br />
      It's you that I hold on to. <br />
      And I know I was <span>wrong.</span> <br />
      But I won't let you down. <br />
      Oh, yeah, I will, yeah, I will, yes, I will."
    </p>

    <p class="credit">- Coldplay, Parachutes</p>
  </body>
</html>
