<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sparks by Coldplay - Colored</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: #00e5ff;
        font-size: 30px;
        text-align: center;
        word-spacing: 20px;
        letter-spacing: 5px;
        background-image:
          linear-gradient(
            to bottom,
            rgb(15 23 42 / 90%) 50%,
            rgb(15 23 42 / 40%)
          ),
          url(https://fastly.picsum.photos/id/10/2500/1667.jpg?hmac=J04WWC_ebchx3WwzbM-Z4_KC_LeLBWr5LZMaAkWkF68);
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
      }

      h1 {
        font-size: 60px;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        background-image: linear-gradient(
          to right,
          rgb(0, 162, 255) 20%,
          rgb(248, 76, 248)
        );
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 10px rgba(72, 202, 237, 0.5));
      }

      .lyrics {
        font-size: 24px;
        line-height: 2.2;
        word-spacing: 5px;
        color: azure;
        background-color: rgb(255 255 255 / 3%);
        max-width: 1000px;
        margin: auto;
        padding: 30px;
        border-radius: 20px;
        border: 1px solid rgb(255 255 255 / 3%);
        box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
      }

      span {
        color: rgb(220, 20, 60);
        text-decoration: none;
        text-shadow: 0 0 10px rgb(248, 50, 89);
      }

      .credit {
        font-size: 16px;
        color: rgb(166, 166, 166);
        letter-spacing: 2px;
        font-weight: normal;
        text-transform: uppercase;
        border-top: 1px solid rgba(255 255 255 / 20%);
        width: 30%;
        margin: 50px auto;
        padding-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>I Saw Sparks</h1>

    <p class="lyrics">
      "My heart is yours. <br />
      It's you that I hold on to. <br />
      And I know I was <span>wrong.</span> <br />
      But I won't let you down. <br />
      Oh, yeah, I will, yeah, I will, yes, I will."
    </p>

    <p class="credit">- Coldplay, Parachutes</p>
  </body>
</html>
