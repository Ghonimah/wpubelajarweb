<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Background Gradient</title>
    <style>
      body {
        background-color: lightblue;
        background-image: linear-gradient(to right, green, blue);
        height: 100vh;
      }
      .kotak1 {
        width: 300px;
        height: 300px;
        background-image: linear-gradient(lightblue, lightgreen);
      }
      .kotak2 {
        width: 300px;
        height: 300px;
        background-image: radial-gradient(blue, red);
      }
      .kotak3 {
        width: 300px;
        height: 300px;
        background-image: conic-gradient(blue, red, yellow);
      }
    </style>
  </head>
  <body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
  </body>
</html>
